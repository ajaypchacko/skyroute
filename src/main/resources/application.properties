spring.application.name=skyroute

# --- Database ---
# ${NAME:default} means "use environment variable NAME if set, otherwise the default".
# Locally the defaults match docker-compose.yml. On AWS we will override them with env vars.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skyroute}
spring.datasource.username=${DB_USERNAME:skyroute}
spring.datasource.password=${DB_PASSWORD:skyroute}

# --- JPA / Hibernate ---
# Flyway owns the schema. Hibernate only CHECKS that our entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway --- (runs automatically on startup, reads src/main/resources/db/migration)
spring.flyway.enabled=true

# --- Kafka: shared ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- Kafka: producer (sending) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Turns our Java event objects into JSON text (Jackson 3 version, used by Spring Boot 4)
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Don't add Java class names to messages, so any reader can consume plain JSON
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# --- Kafka: consumer (receiving) ---
# A new consumer group starts from the OLDEST message, so it also reads events sent before it existed
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the real JSON deserializer. A broken message becomes an
# error we can handle, instead of crashing the consumer in an endless loop.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Our messages carry no Java class name, so tell the deserializer which class to build
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.value.default.type]=com.skyroute.skyroute.ingest.FlightEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.skyroute.skyroute

# --- Logging ---
# Hide the huge "ProducerConfig values" / "ConsumerConfig values" dumps
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN

# --- Admin security ---
# POST /api/flight-events and everything under /api/admin/ needs the header  X-API-Key: <this value>
# The default below is for LOCAL DEVELOPMENT ONLY. On AWS we set the ADMIN_API_KEY environment variable.
skyroute.admin.api-key=${ADMIN_API_KEY:dev-admin-key}

# --- Demo simulator ---
# When true, a random flight event is sent every interval, so the demo moves on its own.
skyroute.simulator.enabled=false
skyroute.simulator.interval-ms=8000