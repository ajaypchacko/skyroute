name: CI

# Runs on every push to main, and on every pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GITHUB_TOKEN is created fresh for every run. "packages: write" lets THIS run
# push a Docker image to GitHub Container Registry (GHCR), with no extra secrets.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # caches ~/.m2 between runs, so dependencies aren't re-downloaded every time

      # Tests are skipped here for the same reason the Dockerfile skips them (see NOTES.md):
      # no automated tests exist yet. This step only proves the code compiles and packages.
      # Once real tests exist, change this to "mvn -B clean verify" and they run here too.
      - name: Build and package
        run: mvn -B clean package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the same Dockerfile from Phase 8 and pushes it as two tags:
      # "latest" (always the newest main) and the commit SHA (an exact, permanent version).
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
