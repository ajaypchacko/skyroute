# SkyRoute local infrastructure: Postgres + Kafka (KRaft mode) + Kafka UI
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept)
# Reset:  docker compose down -v     (also deletes the database volume)

services:
  postgres:
    image: postgres:16
    container_name: skyroute-postgres
    environment:
      POSTGRES_DB: skyroute
      POSTGRES_USER: skyroute
      POSTGRES_PASSWORD: skyroute   # local dev only; real deployments use env vars
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyroute -d skyroute"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: skyroute-kafka
    ports:
      - "9092:9092"                 # for your app running on your laptop
    environment:
      # KRaft mode: this one node acts as both broker and controller (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Three listeners:
      #   HOST       = localhost:9092, used by your app when run from IntelliJ
      #   INTERNAL   = kafka:19092, used by other containers (Kafka UI, later your app)
      #   CONTROLLER = internal Kafka coordination
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-node settings (defaults assume 3 brokers)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: skyroute-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"                 # open http://localhost:8081 (8080 is for your app)
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

volumes:
  postgres-data:
